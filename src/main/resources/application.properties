spring.application.name=comic-catalog-service
server.port=8081
eureka.instance.prefer-ip-address=true
#eureka.client.enabled=false
#spring.cloud.discovery.enabled=false

# Catalog owns app-level collection/folder data, so it gets its own database.
# The ${ENV_VAR:default} format lets Docker or your terminal override these later.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/comic_catalog_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:comic_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:comic_password}

# update lets Hibernate create/update the collection tables during local development.
# Later, for production-style Docker releases, we can switch this to Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
